name: Deploy NIB Assistant to VPS Staging

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          echo "=== 1. Syncing Codebase to VPS Staging ==="
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.git' \
            --exclude 'coverage' \
            --exclude 'recordings' \
            --exclude '.DS_Store' \
            ./ "$SSH_USER@$SSH_HOST:/opt/nib-assistant-staging/"

          echo "=== 2. Rebuilding & Restarting Docker Containers on VPS Staging ==="
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /opt/nib-assistant-staging
            docker compose -f docker-compose.staging.yml up -d --build
            docker compose -f docker-compose.staging.yml restart nginx
            docker compose -f docker-compose.staging.yml exec -T backend npx prisma db push
            docker compose -f docker-compose.staging.yml ps
            sleep 5
            curl -f -s -I http://127.0.0.1:8080/ > /dev/null
            curl -f -s -I http://127.0.0.1:8080/api/ > /dev/null
            echo "=== Staging Deployment Successfully Completed! ==="
          EOF
