name: Deploy NIB Assistant to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "=== 1. Navigating to Application Directory ==="
            cd /opt/nib-assistant

            echo "=== 2. Pulling Latest Code from main branch ==="
            if [ ! -d .git ]; then
              git init
              git remote add origin https://github.com/ekacahya21/NIB-Assistant.git
            fi
            git fetch origin main
            git checkout -f main || git checkout -b main origin/main
            git reset --hard origin/main

            echo "=== 3. Rebuilding & Restarting Docker Containers ==="
            docker compose up -d --build

            echo "=== 4. Running Database Migrations ==="
            docker compose exec -T backend npx prisma db push

            echo "=== 5. Verifying Services Health ==="
            docker compose ps
            sleep 5
            curl -f -s -I http://127.0.0.1/ > /dev/null
            curl -f -s -I http://127.0.0.1/api/ > /dev/null

            echo "=== Deployment Successfully Completed! ==="
          EOF
