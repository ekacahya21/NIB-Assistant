name: Deploy NIB Assistant to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH & Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          echo "=== 1. Syncing Codebase to VPS ==="
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'dist' \
            --exclude '.git' \
            --exclude 'coverage' \
            --exclude 'recordings' \
            --exclude '.DS_Store' \
            ./ "$SSH_USER@$SSH_HOST:/opt/nib-assistant/"

          echo "=== 2. Rebuilding & Restarting Docker Containers on VPS ==="
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            cd /opt/nib-assistant
            docker compose up -d --build
            docker compose restart nginx
            docker compose exec -T backend npx prisma db push
            docker compose ps
            sleep 5
            curl -f -s -I http://127.0.0.1/ > /dev/null
            curl -f -s -I http://127.0.0.1/api/ > /dev/null
            echo "=== Deployment Successfully Completed! ==="
          EOF
